---
name: Validate GitOps Manifests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validation:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install validation tools
        run: make tools

      - name: Run YAML validation
        run: make validate-yaml

      - name: Run Kustomize build validation
        run: make validate-kustomize

      - name: Run best practices linting
        run: make validate-lint
        continue-on-error: true

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validation]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Check validation results
        id: check
        run: |
          echo "Static Validation: ${{ needs.validation.result }}"

          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "❌ Static validation failed"
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ All static validations passed!"
          echo "overall_status=success" >> $GITHUB_OUTPUT

      - name: Post PR comment with validation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const validationStatus = '${{ needs.validation.result }}';

            const statusIcon = (status) => status === 'success' ? '✅' : '❌';
            const statusText = (status) => status === 'success' ? 'Passed' : 'Failed';

            const overallStatus = validationStatus === 'success' ? '✅ All static validations passed!' : '❌ Static validation failed';

            const comment = `## Tier 1 Validation Results (GitHub Actions)

            ${overallStatus}

            | Check | Status | Details |
            |-------|--------|---------|
            | YAML Lint | ${statusIcon(validationStatus)} ${statusText(validationStatus)} | Syntax and formatting validation |
            | Kustomize Build | ${statusIcon(validationStatus)} ${statusText(validationStatus)} | All kustomization layers built successfully |
            | Best Practices | ${statusIcon(validationStatus)} ${statusText(validationStatus)} | Security and best practices linting with kube-linter |

            ${validationStatus === 'success' ? '🚀 **Tier 2 Validation**: Triggered Konflux integration test on ephemeral OpenShift cluster...' : '⚠️ **Tier 2 Validation**: Skipped (fix Tier 1 issues first)'}

            <details>
            <summary>View workflow run</summary>

            [Workflow run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            </details>
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Tier 1 Validation Results')
            );

            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Trigger Konflux integration test
        if: |
          github.event_name == 'pull_request' &&
          steps.check.outputs.overall_status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            // Post /test-integration comment to trigger Konflux pipeline
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '/test-integration'
            });

            console.log('✅ Triggered Konflux integration test via /test-integration comment');
