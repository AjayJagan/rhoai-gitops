name: Validate GitOps Manifests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validation:
    name: Static Validation
    runs-on: ubuntu-latest
    outputs:
      yaml-status: ${{ steps.yaml-check.outcome }}
      yaml-details: ${{ steps.yaml-check.outputs.details }}
      kustomize-status: ${{ steps.kustomize-check.outcome }}
      kustomize-details: ${{ steps.kustomize-check.outputs.details }}
      lint-status: ${{ steps.lint-check.outcome }}
      lint-details: ${{ steps.lint-check.outputs.details }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install validation tools
        run: make tools

      - name: Run YAML validation
        id: yaml-check
        continue-on-error: true
        run: |
          OUTPUT=$(make validate-yaml 2>&1) || {
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" | tail -20 >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "details=Syntax and formatting validation passed" >> $GITHUB_OUTPUT

      - name: Run Kustomize build validation
        id: kustomize-check
        continue-on-error: true
        run: |
          OUTPUT=$(make validate-kustomize 2>&1) || {
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" | tail -20 >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "details=All kustomization layers built successfully" >> $GITHUB_OUTPUT

      - name: Run best practices linting
        id: lint-check
        continue-on-error: true
        run: |
          OUTPUT=$(make validate-lint 2>&1) || {
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" | tail -20 >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 1
          }
          echo "details=Security and best practices checks passed" >> $GITHUB_OUTPUT

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validation]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Check validation results
        id: check
        run: |
          YAML_STATUS="${{ needs.validation.outputs.yaml-status }}"
          KUSTOMIZE_STATUS="${{ needs.validation.outputs.kustomize-status }}"
          LINT_STATUS="${{ needs.validation.outputs.lint-status }}"

          if [[ "$YAML_STATUS" == "success" && "$KUSTOMIZE_STATUS" == "success" && "$LINT_STATUS" == "success" ]]; then
            echo "All static validations passed!"
            echo "overall_status=success" >> $GITHUB_OUTPUT
          else
            echo "Some validations failed"
            echo "overall_status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Prepare validation summary
        if: github.event_name == 'pull_request'
        id: summary
        run: |
          YAML_STATUS="${{ needs.validation.outputs.yaml-status }}"
          YAML_DETAILS="${{ needs.validation.outputs.yaml-details }}"
          KUSTOMIZE_STATUS="${{ needs.validation.outputs.kustomize-status }}"
          KUSTOMIZE_DETAILS="${{ needs.validation.outputs.kustomize-details }}"
          LINT_STATUS="${{ needs.validation.outputs.lint-status }}"
          LINT_DETAILS="${{ needs.validation.outputs.lint-details }}"

          # Helper functions
          status_icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          status_text() { [ "$1" = "success" ] && echo "Passed" || echo "Failed"; }

          format_details() {
            local status=$1
            local details=$2
            if [ "$status" = "success" ]; then
              echo "$details"
            else
              echo "<details><summary>Show error</summary>"
              echo ""
              echo '```'
              echo "$details"
              echo '```'
              echo "</details>"
            fi
          }

          # Check if all passed
          if [[ "$YAML_STATUS" == "success" && "$KUSTOMIZE_STATUS" == "success" && "$LINT_STATUS" == "success" ]]; then
            OVERALL_STATUS="✅ All static validations passed!"
            TIER2_STATUS="**Tier 2 Validation**: Triggered Konflux integration tests on ephemeral OpenShift clusters (OCP 4.19 & 4.20)..."
          else
            OVERALL_STATUS="❌ Some validations failed"
            TIER2_STATUS="⚠️ **Tier 2 Validation**: Skipped (fix Tier 1 issues first)"
          fi

          # Build comment body
          cat << EOF > comment.md
          ## Tier 1 Validation Results (GitHub Actions)

          ${OVERALL_STATUS}

          | Check | Status | Details |
          |-------|--------|---------|
          | YAML Lint | $(status_icon "$YAML_STATUS") $(status_text "$YAML_STATUS") | $(format_details "$YAML_STATUS" "$YAML_DETAILS") |
          | Kustomize Build | $(status_icon "$KUSTOMIZE_STATUS") $(status_text "$KUSTOMIZE_STATUS") | $(format_details "$KUSTOMIZE_STATUS" "$KUSTOMIZE_DETAILS") |
          | Best Practices | $(status_icon "$LINT_STATUS") $(status_text "$LINT_STATUS") | $(format_details "$LINT_STATUS" "$LINT_DETAILS") |

          ${TIER2_STATUS}

          <details>
          <summary>View workflow run</summary>

          [Workflow run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          </details>
          EOF

      - name: Post PR comment with validation results
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          filePath: comment.md
          comment_tag: tier1-validation

      - name: Fail workflow if validations failed
        if: steps.check.outputs.overall_status == 'failure'
        run: |
          echo "One or more validations failed. See PR comment for details."
          exit 1

      - name: Trigger Konflux cluster validation
        if: |
          github.event_name == 'pull_request' &&
          steps.check.outputs.overall_status == 'success'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: '/validate-dependencies'
          comment_tag: trigger-tier2-validation
