---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: rhoai-integration-{{ revision }}
  labels:
    app.kubernetes.io/name: rhoai-gitops
    app.kubernetes.io/component: validation-pipeline
  annotations:
    # Trigger only when PR comment contains "/test-integration"
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-comment: "^/test-integration"
    pipelinesascode.tekton.dev/max-keep-runs: "3"

    # Add PR comment when pipeline starts
    pipelinesascode.tekton.dev/on-started: |
      🚀 **Integration Test Started**

      Provisioning ephemeral OpenShift cluster with RHOAI operators...

      [View pipeline run]({{ console_url }}/k8s/ns/{{ namespace }}/tekton.dev~v1~PipelineRun/{{ run_name }})

    # Add PR comment on success
    pipelinesascode.tekton.dev/on-success: |
      ✅ **Integration Test Passed**

      All RHOAI GitOps manifests validated successfully on ephemeral OpenShift cluster!

      <details>
      <summary>Test Details</summary>

      - OpenShift Version: Auto-selected (latest {{ params.openshift-version-prefix }}.x)
      - Cluster Type: HyperShift on AWS
      - Instance Type: {{ params.instance-type }}
      - Validation: OLM + Server-side dry-run

      [View pipeline run]({{ console_url }}/k8s/ns/{{ namespace }}/tekton.dev~v1~PipelineRun/{{ run_name }})
      </details>

    # Add PR comment on failure
    pipelinesascode.tekton.dev/on-failure: |
      ❌ **Integration Test Failed**

      RHOAI GitOps validation failed on ephemeral cluster.

      [View pipeline logs]({{ console_url }}/k8s/ns/{{ namespace }}/tekton.dev~v1~PipelineRun/{{ run_name }})

spec:
  pipelineSpec:
    description: |
      Validates RHOAI GitOps manifests using an ephemeral OpenShift cluster.
      This pipeline provisions a temporary cluster via EaaS, validates manifests with RHOAI catalogs,
      and cleans up the cluster automatically.

    params:
      - name: git-url
        type: string
        description: Git repository URL

      - name: git-revision
        type: string
        description: Git revision (branch, tag, or commit SHA)

      - name: openshift-version-prefix
        type: string
        description: OpenShift version prefix (e.g., "4.15", "4.16")
        default: "4.19"

      - name: instance-type
        type: string
        description: AWS EC2 instance type for worker nodes
        default: m5.xlarge

    tasks:
      # Task 1: Provision EaaS space
      - name: provision-eaas-space
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions.git
            - name: revision
              value: main
            - name: pathInRepo
              value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
        params:
          - name: ownerName
            value: $(context.pipelineRun.name)
          - name: ownerUid
            value: $(context.pipelineRun.uid)

      # Task 2: Provision ephemeral OpenShift cluster
      - name: provision-cluster
        runAfter:
          - provision-eaas-space
        taskSpec:
          results:
            - name: clusterName
              value: "$(steps.create-cluster.results.clusterName)"
          steps:
            # Get supported OpenShift versions
            - name: get-supported-versions
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-get-supported-ephemeral-cluster-versions/0.1/eaas-get-supported-ephemeral-cluster-versions.yaml
              params:
                - name: eaasSpaceSecretRef
                  value: $(tasks.provision-eaas-space.results.secretRef)

            # Pick latest version matching prefix
            - name: pick-version
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
              params:
                - name: prefix
                  value: "$(params.openshift-version-prefix)."

            # Create ephemeral cluster
            - name: create-cluster
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
              params:
                - name: eaasSpaceSecretRef
                  value: $(tasks.provision-eaas-space.results.secretRef)
                - name: version
                  value: "$(steps.pick-version.results.version)"
                - name: instanceType
                  value: $(params.instance-type)

      # Task 3: Validate manifests on ephemeral cluster
      - name: validate-manifests
        runAfter:
          - provision-cluster
        taskSpec:
          params:
            - name: git-url
              type: string
            - name: git-revision
              type: string
            - name: cluster-name
              type: string
          volumes:
            - name: credentials
              emptyDir: {}
          steps:
            # Get cluster credentials
            - name: get-kubeconfig
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
              params:
                - name: eaasSpaceSecretRef
                  value: $(tasks.provision-eaas-space.results.secretRef)
                - name: clusterName
                  value: $(params.cluster-name)
                - name: credentials
                  value: credentials

