    finally:
      # Cleanup: Delete ephemeral cluster (runs even if validation fails)
      - name: cleanup-ephemeral-cluster
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions.git
            - name: revision
              value: main
            - name: pathInRepo
              value: task/eaas-deprovision-space/0.1/eaas-deprovision-space.yaml
        params:
          - name: eaasSpaceSecretRef
            value: $(tasks.provision-eaas-space.results.secretRef)

  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ revision }}"
    - name: openshift-version-prefix
      value: "4.19"  # Can be overridden via comment: /test-integration version=4.16
    - name: instance-type
      value: m5.xlarge  # EC2 instance type for RHOAI stack

  timeouts:
    pipeline: 1h  # Total timeout for integration test
