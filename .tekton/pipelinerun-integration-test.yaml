#test comment
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: rhoai-integration-{{ revision }}
  labels:
    app.kubernetes.io/name: rhoai-gitops
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-comment: "^/test-integration"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  serviceAccountName: build-pipeline-rhoai-gitops-poc
  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ revision }}"

  pipelineSpec:
    params:
      - name: git-url
        type: string
      - name: git-revision
        type: string

    tasks:
      - name: provision-eaas-space
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions.git
            - name: revision
              value: main
            - name: pathInRepo
              value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
        params:
          - name: ownerName
            value: $(context.pipelineRun.name)
          - name: ownerUid
            value: $(context.pipelineRun.uid)

      - name: provision-cluster
        taskSpec:
          params:
            - name: eaasSpaceSecretRef
              type: string
          results:
            - name: clusterName
              value: $(steps.create-cluster.results.clusterName)
          steps:
            - name: create-cluster
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
              params:
                - name: eaasSpaceSecretRef
                  value: $(params.eaasSpaceSecretRef)
                - name: version
                  value: "4.17.0"
                - name: instanceType
                  value: "m5.xlarge"
        params:
          - name: eaasSpaceSecretRef
            value: $(tasks.provision-eaas-space.results.secretRef)
        runAfter:
          - provision-eaas-space

      - name: test-cluster
        taskSpec:
          params:
            - name: eaasSpaceSecretRef
              type: string
            - name: clusterName
              type: string
          steps:
            - name: get-credentials
              ref:
                resolver: git
                params:
                  - name: url
                    value: https://github.com/konflux-ci/build-definitions.git
                  - name: revision
                    value: main
                  - name: pathInRepo
                    value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
              params:
                - name: eaasSpaceSecretRef
                  value: $(params.eaasSpaceSecretRef)
                - name: clusterName
                  value: $(params.clusterName)
                - name: credentials
                  value: creds

            - name: verify-cluster
              image: quay.io/konflux-ci/appstudio-utils:latest
              env:
                - name: KUBECONFIG
                  value: /credentials/$(steps.get-credentials.results.kubeconfig)
              volumeMounts:
                - name: creds
                  mountPath: /credentials
              script: |
                #!/bin/bash
                set -e

                echo "=== Cluster Information ==="
                kubectl version --short || kubectl version

                echo ""
                echo "=== Cluster Nodes ==="
                kubectl get nodes

                echo ""
                echo "=== Namespaces ==="
                kubectl get namespaces | head -20

                echo ""
                echo "✅ Cluster is accessible and ready!"

          volumes:
            - name: creds
              emptyDir: {}

        params:
          - name: eaasSpaceSecretRef
            value: $(tasks.provision-eaas-space.results.secretRef)
          - name: clusterName
            value: $(tasks.provision-cluster.results.clusterName)
        runAfter:
          - provision-cluster
